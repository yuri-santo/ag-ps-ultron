<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pareamento | Ultron</title><link rel="stylesheet" href="/auth.css"></head><body><main><div class="mark" aria-hidden="true">U</div><small>ULTRON / ACESSO LOCAL</small><h1>Seu cockpit, seus dispositivos.</h1><p id="intro">No notebook, acesse localhost:8090 e toque no escudo para gerar um código. Informe-o aqui para parear este dispositivo.</p><form id="pair"><label>Nome do dispositivo<input id="label" maxlength="60" value="Meu celular" autocomplete="off"></label><label>Código de 8 dígitos<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required></label><button>Parear e entrar</button></form><p id="status" role="status"></p><a href="/">Voltar ao cockpit</a></main><script src="/auth.js"></script></body></html>
