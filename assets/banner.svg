<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Ultron — agente de IA pessoal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121c"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6a0ff"/>
      <stop offset="1" stop-color="#5a45b5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6a0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b6a0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="20" fill="url(#bg)"/>
  <circle cx="140" cy="110" r="120" fill="url(#glow)"/>

  <!-- Ícone hexagonal do Ultron (o mesmo do botão do Stream Deck) -->
  <g transform="translate(72,46) scale(5.4)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 2 21 7v10l-9 5-9-5V7Z" fill="#1b1b26" stroke="url(#accent)" stroke-width="1.7"/>
    <path d="m7 9 5 3 5-3M12 12v6" stroke="#b6a0ff" stroke-width="1.5" filter="url(#soft)"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="100" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="#f5f4fc">ULTRON</text>
  <path d="M252 122 Q 470 134 720 116" stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <text x="252" y="152" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="20" font-weight="500" letter-spacing="0.4" fill="#9293a7">agente de IA pessoal · Hermes · WSL local</text>
  <text x="252" y="180" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="15" font-weight="600" letter-spacing="0.4" fill="#8f83c9">Telegram &amp; voz  ·  time de especialistas  ·  revisão obrigatória  ·  Stream Deck</text>
</svg>
